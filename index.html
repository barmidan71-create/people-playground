<!DOCTYPE html>
<!--comment-->

<html lang="en">
<head>
  <meta charset="utf-8">
    <title>people playground.</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
      #xp-loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 300px;
        background: #ece9d8;
        border: 2px solid #3a6ea5;
        box-shadow: 0 0 0 3px #ffffff inset;
        font-family: Tahoma, sans-serif;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #xp-loader-title {
        background: linear-gradient(#2b74c7, #1a4a9c);
        color: white;
        padding: 4px 8px;
        font-size: 14px;
        text-align: center;
      }
      #xp-by {
        text-align: center;
        font-size: 12px;
        color: #1a4a9c;
        font-weight: bold;
        margin-top: 2px;
        letter-spacing: 1px;
      }
      #xp-for {
        text-align: center;
        font-size: 11px;
        color: #3a6ea5;
        margin-bottom: 4px;
      }
      #xp-checks {
        font-size: 11px;
        color: #222;
        padding: 2px 4px;
        min-height: 72px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .check-line {
        opacity: 0;
        transition: opacity 0.3s;
      }
      .check-line.visible {
        opacity: 1;
      }
      .check-line.done {
        color: #2a8a2a;
      }
      .check-line .check-icon {
        display: inline-block;
        width: 14px;
        text-align: center;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .check-line.blink {
        animation: blink 0.6s infinite;
        color: #cc8800;
      }
      #xp-loader-bar {
        width: 100%;
        height: 18px;
        border: 1px solid #3a6ea5;
        background: white;
        overflow: hidden;
      }
      #xp-loader-fill {
        width: 0%;
        height: 100%;
        background: repeating-linear-gradient(
          -45deg,
          #4a8be0 0px, #4a8be0 10px,
          #3a7bd0 10px, #3a7bd0 20px
        );
        background-size: 28px 100%;
        transition: width 0.3s;
        animation: barberpole 0.6s linear infinite;
      }
      @keyframes barberpole {
        0% { background-position: 0 0; }
        100% { background-position: 28px 0; }
      }
      #xp-loader-text {
        text-align: right;
        font-size: 11px;
        color: #333;
      }
      #unity-loading-bar {
        display: none;
      }
    
</style>
  </head>
  <body>
    <div id="xp-loader">
      <div id="xp-loader-title">People Playground</div>
      <div id="xp-by">by lalad</div>
      <div id="xp-for">для маськи</div>
      <div id="xp-checks"></div>
      <div id="xp-loader-bar"><div id="xp-loader-fill"></div></div>
      <div id="xp-loader-text">0%</div>
    </div>

    <div id="unity-container">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-warning"></div>
    </div>
    <script>
      window.fileMergerConfig = {
        files: [
          { name: 'pggbog.data', parts: 7 },
          { name: 'pggbog.wasm', parts: 3 }
        ],
        basePath: 'Build/',
        debug: true
      };  
  </script>
  <script src="merge.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var xpBox = document.querySelector("#xp-loader");
      var xpChecks = document.querySelector("#xp-checks");
      var xpFill = document.querySelector("#xp-loader-fill");
      var xpText = document.querySelector("#xp-loader-text");
      var warningBanner = document.querySelector("#unity-warning");

      var checks = [
        "проверка систем...",
        "проверка файлов...",
        "проверка соединения...",
        "инициализация..."
      ];

      function runChecks() {
        var i = 0;
        function nextCheck() {
          if (i >= checks.length) {
            showLaunch();
            return;
          }
          var line = document.createElement("div");
          line.className = "check-line visible blink";
          line.innerHTML = '<span class="check-icon">&#9924;</span> ' + checks[i];
          xpChecks.appendChild(line);
          setTimeout(function() {
            line.className = "check-line visible done";
            line.innerHTML = '<span class="check-icon">&#10003;</span> ' + checks[i];
            i++;
            setTimeout(nextCheck, 200 + Math.random() * 300);
          }, 500 + Math.random() * 600);
        }
        nextCheck();
      }

      function showLaunch() {
        var line = document.createElement("div");
        line.className = "check-line visible";
        line.style.cssText = "font-weight:bold;color:#1a4a9c;font-size:13px;text-align:center;padding:4px 0;";
        line.innerHTML = "&#9654; ЗАПУСК!";
        xpChecks.appendChild(line);
        setTimeout(startUnity, 600);
      }

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/pggbog.loader.js";

      function startUnity() {
        var config = {
          dataUrl: buildUrl + "/pggbog.data",
          frameworkUrl: buildUrl + "/pggbog.framework.js",
          codeUrl: buildUrl + "/pggbog.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Studio Minus",
          productName: "People Playground",
          productVersion: "1",
          showBanner: unityShowBanner
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          var meta = document.createElement('meta');
          meta.name = 'viewport';
          meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
          document.getElementsByTagName('head')[0].appendChild(meta);
        }

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            var p = Math.round(progress * 100);
            xpFill.style.width = p + "%";
            xpText.textContent = p + "%";
          }).then((unityInstance) => {
            xpBox.style.display = "none";
          }).catch((message) => {
            alert(message);
          });
        };
        document.body.appendChild(script);
      }

      runChecks();
    </script>
  
</html>
